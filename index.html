<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدفع – د. داليا الفخراني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f3ee;--card:#fff;--ink:#1d2b2a;--mute:#6b7775;--teal:#1f6f6b;--line:#e6e1d8;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:28px 16px}
  .wrap{width:100%;max-width:420px}
  header{text-align:center;margin-bottom:22px}
  .badge{width:96px;height:96px;border-radius:50%;display:block;margin:0 auto 12px;box-shadow:0 4px 14px rgba(74,38,20,.25)}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--mute);font-size:14px;margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .dot{width:12px;height:12px;border-radius:50%}
  .head b{font-size:17px}
  .label{font-size:12px;color:var(--mute);margin-bottom:4px}
  .num{direction:ltr;text-align:right;font-size:22px;font-weight:700;letter-spacing:.5px;margin-bottom:12px;word-break:break-all}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:0;border-radius:12px;font:600 16px 'Cairo',sans-serif;cursor:pointer;text-decoration:none;color:#fff}
  .insta{background:#6a2c91}
  .voda{background:#e60000}
  .ghost{background:#f1ede5;color:var(--ink);margin-top:8px;font-size:14px;padding:11px}
  .note{text-align:center;color:var(--mute);font-size:13px;margin-top:18px;line-height:1.7}
  .en{direction:ltr;font-size:12px;color:var(--mute)}
</style>
</head>
